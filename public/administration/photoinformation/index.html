<div class="page-card">
    <header class="page-header">
        <div class="page-header-top">
            <h1 class="page-title">
                Téléversement d'une image
            </h1>
        </div>
    </header>
    <div class="page-body">
        <div id="cible" class="upload">
            <div class="upload-titre">Cliquez ou glissez-déposez vos images ici</div>
            <div class="upload-details">
                <span>Formats acceptés : <strong>JPG, JPEG, PNG, WEBP, AVIF</strong></span>
                <span>Taille maximale : <strong>300 Ko</strong></span>
                <span>Redimensionnement automatique à <strong>350 px</strong> max de large</span>

            </div>
            L'image sera automatiquement afficher en dessous
        </div>
        <input type="file" id="fichier" accept=".jpg,.jpeg,.png,.webp,.avif" style="display:none">
        <div id="lesCartes" class="d-flex flex-wrap gap-3 justify-content-start"></div>
    </div>
</div>

<!-- Modèle d'une carte photo -->
<template id="tplCartePhoto">
    <div class="card mb-3 shadow-sm" style="flex: 0 1 300px; max-width: 100%;">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span class="nom-fichier text-truncate"></span>
            <button type="button" class="btn-close bouton-supprimer" aria-label="Supprimer"></button>
        </div>
        <div class="card-body d-flex align-items-center justify-content-center" style="height: 250px;">
            <img src="" alt="" class="img-fluid" style="max-height: 100%; object-fit: contain;">
        </div>
    </div>
</template>
